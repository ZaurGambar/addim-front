<!doctype html>
<html lang="az">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <meta name="theme-color" content="#17171b" />
    <script>
      (function () {
        var t = "dark";
        try { t = localStorage.getItem("addim-theme") || "dark"; } catch (e) {}
        document.documentElement.setAttribute("data-theme", t);
        if (t === "light") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#e9e8ed");
      })();
    </script>
    <title>SmartUrban Bakı</title>
    <meta name="description" content="Bakı üçün süni intellekt əsaslı piyada platforması: tematik analiz, sintez, SWOT, 29 anlayış və GeoJSON xəritələri." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SmartUrban Bakı" />
    <meta property="og:description" content="Bakı üçün süni intellekt əsaslı piyada platforması. “İnsanyönümlü şəhərlər” hakatonu, 2026." />
    <meta property="og:locale" content="az_AZ" />
    <meta property="og:image" content="/images/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify Forms: deploy zamanı formları tanımaq üçün gizli nüsxələr -->
    <form name="field-check" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="point" /><input name="works" /><input name="lift" /><input name="zebra_m" /><input name="signal" />
      <input name="ped_under" /><input name="ped_over" /><input type="file" name="photo" /><textarea name="note"></textarea>
      <input name="g1" /> <input name="g2" /> <input name="g3" /> <input name="g4" /> <input name="g5" /> <input name="g6" /> <input name="g7" /> <input name="g8" /> <input name="g9" /> <input name="g10" /> <input name="g11" /> <input name="g12" />
      <input name="a1" /> <input name="a2" /> <input name="a3" /> <input name="a4" /> <input name="a5" /> <input name="a6" /> <input name="a7" /> <input name="a8" /> <input name="a9" /> <input name="a10" /> <input name="a11" /> <input name="a12" /> <input name="a13" /> <input name="a14" /> <input name="a15" /> <input name="a16" /> <input name="a17" /> <input name="a18" /> <input name="a19" /> <input name="a20" />
      <input name="gehl_score" /><input name="access_pct" />
    </form>
    <form name="data-report" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="context" /><textarea name="message"></textarea><input name="email" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
