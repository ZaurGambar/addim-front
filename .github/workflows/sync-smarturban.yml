# ADDIM datası və şəhər analizi modulu → SmartUrban repoları (avtomatik və əl ilə)
#   avtomatik: main-ə push (data, skriptlər və ya src dəyişəndə)
#   əl ilə:    GitHub → Actions → "Sync SmartUrban" → Run workflow
# Lazım olan secret (Settings → Secrets → Actions): SMARTURBAN_TOKEN — ilkoninn/smarturban-be və
# ilkoninn/smarturban-admin repolarına yazma icazəsi olan GitHub token (contents: write, workflow lazım deyil).
# Diqqət: smarturban-be main-ə push prod deploy-u başladır (yeni SeedData prod-a gedir).
name: Sync SmartUrban

on:
  push:
    branches: [main]
    paths:
      - "public/data/**"
      - "src/**"
      - "scripts/export_smarturban.py"
      - "scripts/sync_smarturban.sh"
  workflow_dispatch:
    inputs:
      api:
        description: "SmartUrban API (2GIS proxy və marşrut üçün)"
        default: "https://smartflow.runasp.net/api"

concurrency:
  group: sync-smarturban
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Token yoxlaması
        id: tok
        run: |
          if [ -z "${{ secrets.SMARTURBAN_TOKEN }}" ]; then
            echo "::warning::SMARTURBAN_TOKEN secret-i yoxdur: sinxronizasiya atlanır."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == 'true'
        with: { path: addim-front }
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == 'true'
        with: { repository: ilkoninn/smarturban-be, token: "${{ secrets.SMARTURBAN_TOKEN }}", path: smarturban-be }
      - uses: actions/checkout@v4
        if: steps.tok.outputs.ok == 'true'
        with: { repository: ilkoninn/smarturban-admin, token: "${{ secrets.SMARTURBAN_TOKEN }}", path: smarturban-admin }

      - uses: actions/setup-node@v4
        if: steps.tok.outputs.ok == 'true'
        with: { node-version: 20, cache: npm, cache-dependency-path: addim-front/package-lock.json }
      - uses: actions/setup-python@v5
        if: steps.tok.outputs.ok == 'true'
        with: { python-version: "3.12" }

      - name: Asılılıqlar
        if: steps.tok.outputs.ok == 'true'
        run: |
          pip install --quiet shapely
          cd addim-front && npm ci --no-audit --no-fund

      - name: Sinxronizasiya
        if: steps.tok.outputs.ok == 'true'
        working-directory: addim-front
        env:
          SMARTURBAN_API: ${{ github.event.inputs.api || 'https://smartflow.runasp.net/api' }}
        run: bash scripts/sync_smarturban.sh

      - name: Commit və push
        if: steps.tok.outputs.ok == 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          for r in smarturban-be smarturban-admin; do
            cd "$GITHUB_WORKSPACE/$r"
            git add -A src/SmartUrban.Api/SeedData public/addim 2>/dev/null || true
            if git diff --cached --quiet; then echo "$r: dəyişiklik yoxdur"; continue; fi
            git -c user.name="addim-sync[bot]" -c user.email="addim-sync@users.noreply.github.com" \
              commit -q -m "ADDIM sinxronizasiyası (addim-front@${SHA::7})"
            git push origin HEAD:main
          done
